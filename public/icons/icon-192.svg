<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>
  
  <!-- Outer Shield contour -->
  <path d="M 96 28 L 146 50 C 146 95 125 136 96 156 C 67 136 46 95 46 50 Z" 
        fill="url(#shield)" stroke="#60A5FA" stroke-width="4" stroke-linejoin="round"/>
        
  <!-- Inner Shield accent -->
  <path d="M 96 38 L 136 56 C 136 92 119 126 96 142 C 73 126 56 92 56 56 Z" 
        fill="#1E293B" opacity="0.6"/>

  <!-- Electric Spark / Bolt in Gold -->
  <path d="M 102 54 L 78 94 L 94 94 L 90 134 L 118 86 L 102 86 Z" 
        fill="url(#gold)"/>
        
  <!-- Verification check badge -->
  <circle cx="132" cy="132" r="22" fill="#10B981" stroke="#0F172A" stroke-width="4"/>
  <path d="M 122 132 L 129 139 L 143 124" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
